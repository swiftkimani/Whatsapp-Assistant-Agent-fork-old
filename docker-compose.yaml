# Deployed by Coolify. Two services on a private network: only the backend is
# ever reachable from outside, and the bridge's send API never leaves it.
#
# Required values use Compose's ${VAR:?} form, which Coolify turns into a field
# that blocks deployment until it is filled. ALLOWED_CONTACTS is deliberately
# among them: empty means every sender is processed, and that should not be
# reachable by forgetting to type something.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify routes the domain here and substitutes the hostname. No path:
      # a value here becomes the routed path, and restricting it to /dashboard
      # would make every /api/* call the page makes 404.
      SERVICE_FQDN_BACKEND_8000: ""

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      # These two have to move together, and this pair did not. Thinking tokens
      # are drawn from max_tokens, so raising effort without raising the ceiling
      # buys reasoning that eats the budget the reply needed: the call returns a
      # thinking block and no text, _parse_answer reads that as malformed, and
      # verify() holds it. The failure is silent — it looks like the model
      # choosing to hold, not like running out of room. app/llm.py defaults to
      # high/8192 for exactly this reason and these defaults contradicted it at
      # medium/4096, so the deployed service was the cheaper, dumber one and
      # anyone who set EFFORT=high in Coolify got the truncation instead.
      #
      # high because the replies worth sending are the ones that needed the
      # sender's history, the schedule and the redirect rules weighed together.
      # Only tokens actually generated are billed, so the 8192 is a ceiling,
      # not a cost.
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-8192}

      # argon2id only. The plaintext DASHBOARD_PASSWORD is for a dashboard on
      # loopback; this one is on the internet.
      #
      # Base64, because an argon2 hash is built from "$$" separators and this
      # value passes through Docker Compose interpolation, which reads "$$NAME"
      # as a variable and replaces it with nothing. A raw hash arrives shredded
      # and then rejects every password. scripts/hash_password.py prints both.
      DASHBOARD_PASSWORD_HASH_B64: ${DASHBOARD_PASSWORD_HASH_B64:?}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}

      # Generated once by Coolify and identical in both services, because the
      # name matches. Nobody has to invent or copy it.
      BRIDGE_API_TOKEN: ${SERVICE_PASSWORD_64_BRIDGE}
      BRIDGE_API_URL: http://bridge:3001

      ALLOWED_CONTACTS: ${ALLOWED_CONTACTS:?}
      ALLOW_GROUPS: ${ALLOW_GROUPS:-false}
      CONTACTS_FILE: /app/data/contacts.json

      USER_NAME: ${USER_NAME:-}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Arianna}
      ASSISTANT_NICKNAMES: ${ASSISTANT_NICKNAMES:-Arie}
      # Still "en" and not "auto". Forcing English mangles a Kiswahili voice
      # note, but letting Whisper choose measured no better: across 16 clips
      # "auto" moved Kiswahili from 1.30 to 0.96 word error rate at "base" and
      # made Sheng worse (0.90 to 1.04), left both unchanged at "small", and
      # costs a second decode pass when it changes its mind. Numbers in
      # docs/host-memory.md.
      STT_LANGUAGE: ${STT_LANGUAGE:-en}

      # "base", not "small". Measured here with scripts/measure_whisper.py and
      # 16 synthetic clips (Kenyan English, Kiswahili, Sheng):
      #
      #   size    int8 weights   peak RSS   per 5 s clip   English WER
      #   tiny         72 MiB     350 MiB        0.35 s           0.02
      #   base        139 MiB     398 MiB        0.82 s           0.02
      #   small       461 MiB     742 MiB        1.50 s           0.01
      #
      # "small" costs 323 MiB of weights that stay resident between voice
      # notes, and buys one word in seventy-two of English. It buys nothing on
      # Kiswahili or Sheng: those fail at every size (0.85 to 1.26 WER, and one
      # clip hallucinates unrelated English at "small" as well), so model size
      # is not the lever for them.
      #
      # Not "tiny", which scored the same on English: these clips are clean
      # text-to-speech, the kindest audio Whisper ever gets, and nothing
      # measured here stands in for a bad line or a noisy matatu. "base" keeps
      # a margin for 66 MiB.
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}

      # Empty on purpose: that empty value is the memory decision. app/
      # dashboard.py reads it as `os.getenv(...) or None` and app/stt.py
      # answers a None with WHISPER_MODEL_SIZE, so empty means the dashboard
      # and the webhook share ONE loaded model. Naming a size here opts into a
      # second one — app/stt.py caches one model per distinct size, so two
      # sizes means both sets of weights resident at once.
      DASHBOARD_WHISPER_SIZE: ${DASHBOARD_WHISPER_SIZE:-}

      # Five minutes rather than the fifteen app/stt.py defaults to, because
      # this is the host that went into swap. The cost is measured: reloading
      # "base" from the model cache took 0.9 s, paid once by the next voice
      # note after a five-minute gap. Two honest limits on what it buys. The
      # eviction only runs when a transcription arrives, so one voice note
      # followed by a quiet week still holds its model for the week —
      # app/stt.py explains why it grows no timer for that, and wiring
      # _evict_idle into /health is the change that would close it. And
      # handing the pages back to the kernel is glibc's malloc_trim doing its
      # best: measured on macOS, an evict-and-reload returned nothing at all,
      # so run scripts/measure_whisper.py on the host to see what it returns
      # there.
      MODEL_IDLE_MINUTES: ${MODEL_IDLE_MINUTES:-5}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      TZ: ${TZ:-Africa/Nairobi}

      # ctranslate2 (faster-whisper) sizes its thread pool from the host's
      # core count, so one voice note recruited every vCPU the VPS has — and
      # then kept the memory. glibc gives each allocating thread a 64 MiB
      # arena of its own and never takes one back, which is the likeliest
      # explanation for the gap between the models and libraries this service
      # can actually account for and the 3840 MiB the host's monitor reported
      # (then ~1.9 GiB of it, with BLIP and torch still here; now ~800 MiB —
      # see the resources block below). Two threads is slower per transcription and
      # much cheaper per container, and on a host already 88% into swap the
      # extra threads were buying latency that swapping took straight back.
      OMP_NUM_THREADS: 2
      MALLOC_ARENA_MAX: 2
    # Declared so Coolify's domain check can see the port uvicorn binds; the
    # port is reachable on the internal network either way, never published.
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
      - model-cache:/models
    networks: [internal]
    # Neither service was capped until the host's monitor reported 3840 MiB
    # here, 3709 MiB in the bridge and 88% of swap in use. A machine that deep
    # in swap is slow at everything, which is almost certainly what made
    # /api/wa/chats take 3.4 seconds. A limit is a ceiling, not a request: it
    # costs nothing until something tries to pass it.
    #
    # 1.5 GiB is what this service can justify, not a tidy figure, and it is
    # half what it was: BLIP is gone, and with it torch and transformers.
    # Photos now go to the model as images and it looks at them itself, so the
    # only model that still runs in this container is Whisper.
    #
    # app/main.py boots at 135 MiB measured (the interpreter, FastAPI, the
    # Anthropic client and the dashboard; ctranslate2 and Pillow load on
    # demand, not at import — tests/test_lazy_models.py holds that). The
    # default is now "base", which measured 272 MiB of resident growth when it
    # loads, and it stays: the cache is a module-level global, held
    # deliberately so the next voice note does not pay the load again. A photo
    # is transient now — Pillow decodes it, scales the long edge to 1568 and
    # frees it within the request — where it used to add ~1 GB of fp32 weights
    # that never came back down, plus ~115 MiB just to import torch. So
    # ~410 MiB accounted for, down from ~800 when this was "small"; the rest of
    # the ceiling is allocator retention (which is what MALLOC_ARENA_MAX above
    # is about) and a request's own buffers.
    #
    # 1536m stays, even though the accounted figure halved. A limit is a
    # ceiling: lowering it frees nothing until something tries to pass it, and
    # the job it is doing here is capping a runaway, which it does as well at
    # 1536m as at any lower number. What actually came off the host is the
    # 323 MiB of weights that are no longer loaded.
    #
    # Raising WHISPER_MODEL_SIZE or DASHBOARD_WHISPER_SIZE means raising this
    # too: "small" is 461 MiB of weights and "medium" roughly 1.2 GiB, and
    # app/stt.py keeps one loaded model per distinct size — two sizes set to
    # "medium" would not fit under this at all.
    #
    # cpus 1.5 because the only thing here that wants a core is a
    # transcription, OMP_NUM_THREADS above holds that to two threads, and this
    # serves one person sending one voice note at a time.
    #
    # The reservation is a floor, not an allocation: it tells the kernel which
    # 1 GiB to leave alone when the host is under pressure, so the models that
    # are already loaded are not the pages that get pushed into swap.
    #
    # The host is 6 cores and 11.7 GB (Coolify's server page, 2026-11-04), so
    # these ceilings are set to cap the runaway rather than to ration a small
    # machine: 1.5 GiB here and 3 GiB for the bridge is 4.5 of 11.7, which
    # leaves Coolify itself and the page cache room to breathe. A ceiling
    # under the real working set does not save memory, it turns a slow service
    # into one the kernel keeps killing — which is why this is still roughly
    # twice what is accounted for above, the same margin the 3 GiB had.
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.5"
        reservations:
          memory: 1024m

  bridge:
    build:
      context: .
      dockerfile: whatsapp-bridge/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000/webhook
      BRIDGE_API_TOKEN: ${SERVICE_PASSWORD_64_BRIDGE}
      BRIDGE_API_PORT: 3001
      # Loopback is the default in code; inside the network the backend is a
      # different host. The port is never published, and the token still applies.
      BRIDGE_API_HOST: 0.0.0.0
      ALLOWED_CONTACTS: ${ALLOWED_CONTACTS:?}
      ALLOW_GROUPS: ${ALLOW_GROUPS:-false}
      CONTACTS_FILE: /app/data/contacts.json
      # Most contacts one "Sync from WhatsApp" may add. That file is the list
      # the dashboard may message, so a sync widens it; this bounds how far.
      CONTACTS_SYNC_LIMIT: ${CONTACTS_SYNC_LIMIT:-500}
      # A burst of messages from one person is answered as a single turn, once
      # that chat has gone quiet for BURST_QUIET_MS. Two reasons, and the
      # second is the important one: a reply per message answered whichever
      # message arrived first while the live question was still being typed,
      # and it put several sends on the account inside one second, which is
      # what automated messaging looks like from WhatsApp's side. Defaults live
      # in whatsapp-bridge/burst.js; BURST_QUIET_MS=0 restores one reply per
      # message if this ever feels too slow in use.
      BURST_QUIET_MS: ${BURST_QUIET_MS:-}
      BURST_CEILING_MS: ${BURST_CEILING_MS:-}
      BURST_MAX_MESSAGES: ${BURST_MAX_MESSAGES:-}
      # Set to link by typed code rather than by scanning a QR off a log viewer.
      PAIRING_NUMBER: ${PAIRING_NUMBER:-}
      # Bump when linking starts failing: WhatsApp refuses new device links on
      # a stale web build. See wppconnect-team/wa-version.
      WA_WEB_VERSION: ${WA_WEB_VERSION:-}
      TZ: ${TZ:-Africa/Nairobi}
    expose:
      - "3001"
    volumes:
      # Shared with the backend so contacts.json exists once. Both images run as
      # uid 10001, so the permissions line up.
      - app-data:/app/data
      - wa-session:/app/whatsapp-bridge/.wwebjs_auth
    networks: [internal]
    # Chromium is the 3709 MiB the monitor warned about and the 200–280%
    # sustained CPU beside it. Most of that was WhatsApp Web's own JavaScript
    # heap: V8 sizes its old space from how much memory the machine appears to
    # have, so on an uncapped container it had no reason to collect anything,
    # and the chat store simply accumulated. index.js now passes
    # --max-old-space-size=512 to bound it, which is what makes a 2 GiB ceiling
    # plausible rather than optimistic — a renderer's non-heap side (Blink's own
    # objects, decoded media) plus the browser process and node should land
    # near 1.4 GiB.
    #
    # This is the number most likely to be wrong, because nothing here measured
    # the real working set. That is deliberate: if the V8 cap does not bite, the
    # container is OOM-killed and restarts, which is loud, costs a WhatsApp
    # re-sync from the saved session rather than a re-link, and tells us within
    # a day. A host sitting at 88% swap is the silent version of the same
    # problem and degrades every request instead. Raise this to 2560m if the
    # kernel starts killing it.
    #
    # No shm_size on purpose: it and --disable-dev-shm-usage (already in
    # index.js) are two answers to the same question, and setting both just
    # means Chromium ignores the tmpfs we paid for. Under a memory limit the
    # flag is the better of the two — a tmpfs /dev/shm is charged to this
    # container's memory cgroup, so a 512m one would spend a quarter of the
    # ceiling on shared memory and turn a renderer allocation into an OOM kill,
    # whereas the flag's files land on the container filesystem as page cache
    # the kernel can reclaim.
    #
    # 3 GiB rather than the 2 GiB this was first set to. Both numbers cap the
    # 3709 MiB the monitor saw, so both stop the runaway; the difference is
    # what happens if --max-old-space-size does not bite. At 2 GiB that is an
    # OOM kill during the initial WhatsApp Web sync, which is the one failure
    # that could loop — killed before it is ever ready, restarted, killed
    # again. On a machine with 11.7 GB there is no reason to take that bet to
    # save a gigabyte nothing else is asking for.
    #
    # Left at 3072m deliberately while chasing the host's swap, and that is
    # worth saying plainly because the number looks like the obvious thing to
    # cut. It is not: this reserves nothing, so lowering it to 2048m would free
    # exactly zero bytes unless the bridge's working set is between the two —
    # in which case the kernel kills it mid-sync instead. Under cgroup v2 a
    # tighter ceiling can even push the reported swap figure UP, because
    # nearing memory.max forces reclaim and reclaim is what writes anonymous
    # pages to swap. Nothing here can measure Chromium's real working set:
    # there is no WhatsApp session and no docker daemon on the development
    # machine. The host can, and docs/host-memory.md has the commands —
    # memory.peak under 1.5 GiB over a week would make 2048m defensible, and
    # it would still save nothing.
    #
    # cpus 2, not 1.5: this was sustaining 200–280% of one core, so 1.5 would
    # have cut the initial sync roughly in half for no gain on a 6-core host.
    # It still holds the container to a third of the machine.
    deploy:
      resources:
        limits:
          memory: 3072m
          cpus: "2"
        reservations:
          memory: 512m

volumes:
  # The SQLite database, held queue, your notes and contacts.json. Backed up
  # by scripts/wa_backup.sh, which copies the database with VACUUM INTO rather
  # than cp — this one is in WAL mode and a cp of a live WAL database is a
  # coin toss.
  app-data:
  # Whisper's weights, downloaded through HF_HOME on the first voice note.
  # Without this every deploy re-downloads them. Not worth backing up: it
  # rebuilds itself from Hugging Face.
  model-cache:
  # Live credentials for the linked WhatsApp account, and the ONLY copy of
  # something this server cannot recreate: linking a new companion device needs
  # a passkey ceremony, which needs a real browser and an authenticator, so the
  # container cannot link itself. Lose this volume and the account's link is
  # gone with no recovery path from here.
  #
  # Back it up with scripts/wa_backup.sh and read docs/session-backup.md first.
  # Anyone who holds a copy can answer messages as the owner, so a copy is a
  # credential and belongs where a credential belongs: chmod 600, never in this
  # repo, never in a bucket, never in a chat.
  wa-session:

networks:
  internal:
